# Application
spring.application.name=credit-service
server.port=8082

# PostgreSQL - shared LimitGuard database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/limitguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# JWT authentication - shared with Auth Service
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

internal-service-key=${INTERNAL_SERVICE_KEY}

# ==========================================
# KAFKA CONFIGURATION
# ==========================================

# Tells Spring Boot where Kafka is running.
# localhost = my computer, 9092 = Kafka's port.
# We can change the address using an environment variable.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Converts the message key from a String into bytes
# because Kafka sends data as bytes.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Converts the message content from a String into bytes.
# Our notification events will be sent as JSON text.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka confirms the message only after all in-sync
# replicas have acknowledged it.
spring.kafka.producer.acks=all

# Prevents duplicate messages caused by certain
# automatic retries from the same Kafka producer.
spring.kafka.producer.properties.enable.idempotence=true

# If sending a message temporarily fails,
# Kafka's producer can retry up to 3 times.
spring.kafka.producer.retries=3

# ==========================================
# NOTIFICATION OUTBOX RELAY
# ==========================================
# Enables Credit Service to publish pending notification events to Kafka.
# false by default, so we explicitly enable it for local development testing.
limitguard.notification-relay.enabled=true

# Automatically expire overdue reserved credit requests
limitguard.credit-request-expiry.enabled=true

# Enable automatic exposure history snapshots
limitguard.exposure-snapshots.enabled=true