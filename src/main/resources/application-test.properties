# Test database - isolated from the development PostgreSQL database
spring.datasource.url=jdbc:h2:mem:limitguard_test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create a fresh schema for each test run
spring.jpa.hibernate.ddl-auto=create-drop

# Test JWT configuration
# This is a non-production test value used only by automated tests
jwt-secret=LimitGuardTestJwtSecretKeyForAutomatedTestingOnly123456789
jwt-expiration-ms=86400000

# Do not use the real Gmail account during automated tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false