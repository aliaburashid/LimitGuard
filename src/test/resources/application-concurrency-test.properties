# Separate PostgreSQL database for concurrency integration tests
spring.datasource.url=jdbc:postgresql://localhost:5432/limitguard_concurrency_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${TEST_DB_PASSWORD}

# Create a fresh schema for each integration test run
spring.jpa.hibernate.ddl-auto=create-drop

# Test JWT configuration
jwt-secret=LimitGuardTestJwtSecretKeyForAutomatedTestingOnly123456789
jwt-expiration-ms=86400000

# Disable real email delivery during tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Allow multiple threads to use separate database connections
spring.datasource.hikari.maximum-pool-size=10