spring.application.name=auth-service

# Auth Service runs separately from the original LimitGuard
server.port=8081

# Shared PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/limitguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# JWT authentication
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Match the monolith's profile picture upload limits.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Override when profile pictures are stored outside the LimitGuard checkout.
limitguard.profile-pictures.directory=${PROFILE_PICTURE_DIRECTORY:}
