server {
    # Nginx listens on port 80 inside the Docker container
    listen 80;

    # Accept requests from any hostname
    server_name _;

    # Location of our React production build files
    root /usr/share/nginx/html;

    # Default page served when visiting the application
    index index.html;

    # Serve React pages and support client-side routing
    # If a requested path does not exist, return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to our Spring Boot API Gateway
    # "api-gateway" will be the service name in Docker Compose
    location /api/ {
        proxy_pass http://api-gateway:8080;

        # Forward the original hostname and client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses such as SSE
        proxy_buffering off;
    }
}
