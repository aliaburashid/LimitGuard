spring.application.name=api-gateway

# API Gateway runs on port 8080
server.port=8080


# ------------------------------------------
# Auth Service route
# ------------------------------------------

# Gives the first route a unique name
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
# Tells the Gateway where to forward matching requests
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
# Defines which URL paths belong to Auth Service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/users/**,/api/auth/sso/**,/api/financial-institutions/**


# ------------------------------------------
# Credit Service route
# ------------------------------------------

# gives the second route a unique name
spring.cloud.gateway.server.webflux.routes[1].id=credit-service
# tells the Gateway where Credit Service is running
spring.cloud.gateway.server.webflux.routes[1].uri=${CREDIT_SERVICE_URL:http://localhost:8082}
# Defines which URL paths belong to Credit Service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/credit-requests/**,/api/credit-limits/**,/api/group-credit-limits/**,/api/counterparties/**,/api/corporate-groups/**,/api/corporate-group-memberships/**,/api/audit-logs


# ------------------------------------------
# Activity Service - handles real-time notifications using Server-Sent Events (SSE)
# ------------------------------------------

# Unique identifier for the Activity Service route
spring.cloud.gateway.server.webflux.routes[2].id=activity-service
# URL where Activity Service is running (port 8083)
spring.cloud.gateway.server.webflux.routes[2].uri=${ACTIVITY_SERVICE_URL:http://localhost:8083}
# Forward requests matching this endpoint to Activity Service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/credit-requests/events
# Only allow GET requests to match this route because SSE uses GET
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=GET
# Give Activity Service higher priority than Credit Service (default order is 0)
# This prevents Credit Service from handling the overlapping /api/credit-requests/events endpoint
spring.cloud.gateway.server.webflux.routes[2].order=-1
