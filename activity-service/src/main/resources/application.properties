spring.application.name=activity-service
server.port=8083

# PostgreSQL - shared LimitGuard database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/limitguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate checks existing mappings without creating or updating tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# Kafka sends credit request notifications as JSON text.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${ACTIVITY_KAFKA_GROUP_ID:limitguard-activity-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# Auth checks the current user when a browser opens an SSE connection.
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
internal-service-key=${INTERNAL_SERVICE_KEY:}

# Enable the email consumer only after reviewing the new group's starting offsets.
activity.email.enabled=${ACTIVITY_EMAIL_CONSUMER_ENABLED:false}
activity.email.group-id=${ACTIVITY_EMAIL_KAFKA_GROUP_ID:limitguard-activity-email-v1}

# Keep SMTP delivery off until the sender and Auth key have been configured.
activity.email.delivery-enabled=${ACTIVITY_EMAIL_DELIVERY_ENABLED:false}
activity.email.recipient-key=${ACTIVITY_NOTIFICATION_RECIPIENT_KEY:}
activity.email.from=${GMAIL_USERNAME}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${ACTIVITY_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${ACTIVITY_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${ACTIVITY_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
